# Uso:
#   docker compose up --build                       -> base :5432, API :8000, trabajador :8501, RR.HH. :8502,
#                                                      RR.HH. en React :8503
#   docker compose --profile ollama up --build      -> ademas levanta un Ollama dentro de Docker
#   docker compose run --rm --no-deps app pytest    -> tests (SQLite temporal y API en proceso: sin red)
#
# Una sola fuente de verdad: la base PostgreSQL. La API es el único proceso que la abre, junto con
# el índice de Chroma. Las dos interfaces hablan solo con la API. Los archivos de data/ son la carga
# inicial de una base vacía.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liquidaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liquidaciones}
      POSTGRES_DB: ${POSTGRES_DB:-liquidaciones}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: liquidaciones-agent:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # sin .env se usan los valores por defecto de harness/config.py
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-liquidaciones}:${POSTGRES_PASSWORD:-liquidaciones}@db:5432/${POSTGRES_DB:-liquidaciones}
      # localhost dentro del contenedor no es el Mac. Esta URL llega al Ollama del host.
      # Si usas el servicio "ollama" de este compose, cámbiala a http://ollama:11434.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_DIR: /app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db   # el indice sobrevive a reinicios
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necesario en Linux; en Docker Desktop ya existe
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  app:
    build: .
    image: liquidaciones-agent:latest
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  rrhh:
    build: .
    image: liquidaciones-agent:latest
    ports:
      - "8502:8502"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: ["streamlit", "run", "rrhh/streamlit_app.py", "--server.port=8502", "--server.address=0.0.0.0", "--server.headless=true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8502/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./web
    image: liquidaciones-agent-web:latest
    ports:
      - "8503:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Luego:  docker compose exec ollama ollama pull llama3.1:8b
    #         docker compose exec ollama ollama pull nomic-embed-text-v2-moe
    #         y usa OLLAMA_BASE_URL=http://ollama:11434 en .env

volumes:
  pg_data:
  chroma_data:
  ollama_data:
